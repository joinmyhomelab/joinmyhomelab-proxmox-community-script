name: shellcheck
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck joinmyhomelab-node.sh
      - name: dry run
        run: ./joinmyhomelab-node.sh --dry-run --yes --iso https://example.com/joinmyhomelab-test.iso
